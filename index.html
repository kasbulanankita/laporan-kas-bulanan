
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Kas Bulanan</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:16px;color:#1e293b}
.container{max-width:750px;margin:auto}
header{background:#14532d;color:white;padding:22px;border-radius:14px;text-align:center}
header h1{margin:0 0 8px;font-size:24px}
.card{background:white;padding:18px;border-radius:12px;margin-top:16px;box-shadow:0 2px 8px #0000000d}
h2{font-size:18px;margin-top:0}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
button{background:#15803d;color:white;border:0;font-weight:bold;cursor:pointer}
button.delete{background:#dc2626}
button.export{background:#2563eb}
button.edit{background:#d97706}
button.cancel{background:#64748b}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{padding:12px 8px;border-radius:10px;background:#ecfdf5;text-align:center;overflow-wrap:anywhere}
.summary div:nth-child(2){background:#fef2f2}
.summary div:nth-child(3){background:#eff6ff}
.summary small{display:block;font-size:12px;margin-bottom:7px}
.summary strong{font-size:14px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 5px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#f8fafc}
.income{color:#15803d;font-weight:bold}
.expense{color:#dc2626;font-weight:bold}
.empty{text-align:center;color:#64748b;padding:20px}
.actions button{width:auto;padding:7px;margin:2px;font-size:12px}
@media(max-width:420px){
.summary{grid-template-columns:1fr}
.summary div{display:flex;justify-content:space-between;align-items:center}
.summary small{margin:0}
.summary strong{font-size:15px}
}
@media print{
body{background:white;padding:0;color:black}
.container{max-width:none}
header{background:white!important;color:black;border:1px solid #999}
.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
.no-print,.actions{display:none!important}
.summary div{border:1px solid #ccc;background:white!important}
table{font-size:11px}
th,td{border:1px solid #ccc}
}
</style>
</head>
<body>
<div class="container">

<header>
<h1>Laporan Kas Bulanan</h1>
<p>Catatan pemasukan dan pengeluaran kas</p>
</header>

<div class="card no-print">
<h2>Pilih Bulan</h2>
<input type="month" id="bulan">
</div>

<div class="card">
<h2>Ringkasan Kas</h2>
<div class="summary">
<div><small>Total Pemasukan</small><strong id="totalMasuk">Rp0</strong></div>
<div><small>Total Pengeluaran</small><strong id="totalKeluar">Rp0</strong></div>
<div><small>Saldo Akhir</small><strong id="saldo">Rp0</strong></div>
</div>
</div>

<div class="card no-print">
<h2 id="judulForm">Tambah Transaksi</h2>
<form id="formKas">
<input type="date" id="tanggal" required>

<select id="jenis" required>
<option value="masuk">Pemasukan</option>
<option value="keluar">Pengeluaran</option>
</select>

<input type="text" id="keterangan" placeholder="Keterangan transaksi" required>
<input type="number" id="jumlah" placeholder="Jumlah uang (Rp)" min="1" required>

<button type="submit" id="tombolSimpan">Simpan Transaksi</button>
<button type="button" class="cancel" id="tombolBatal" style="display:none" onclick="batalEdit()">Batal Edit</button>
</form>
</div>

<div class="card">
<h2>Riwayat Transaksi</h2>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Jenis</th>
<th>Jumlah</th>
<th class="no-print">Aksi</th>
</tr>
</thead>
<tbody id="daftarKas"></tbody>
</table>
</div>

<p id="kosong" class="empty">Belum ada transaksi bulan ini.</p>

<div class="no-print">
<button class="export" onclick="cetakPDF()">Cetak / Simpan PDF</button>
<button class="export" onclick="eksporCSV()">Ekspor ke CSV</button>
<button class="delete" onclick="hapusSemua()">Hapus Semua Data</button>
</div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

let dataKas = JSON.parse(
localStorage.getItem("dataKasBulanan") || "[]"
);

let idEdit = null;

const rupiah = angka => new Intl.NumberFormat("id-ID", {
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}).format(angka);

function simpan(){
localStorage.setItem("dataKasBulanan", JSON.stringify(dataKas));
}

function tampilkan(){
const bulan = $("bulan").value;

const data = dataKas
.filter(x => x.tanggal.startsWith(bulan))
.sort((a,b) => a.tanggal.localeCompare(b.tanggal));

let masuk = 0;
let keluar = 0;

data.forEach(x => {
if(x.jenis === "masuk") masuk += x.jumlah;
else keluar += x.jumlah;
});

$("totalMasuk").textContent = rupiah(masuk);
$("totalKeluar").textContent = rupiah(keluar);
$("saldo").textContent = rupiah(masuk-keluar);
$("daftarKas").innerHTML = "";

$("kosong").style.display = data.length ? "none" : "block";

data.forEach(x => {
const tr = document.createElement("tr");

const values = [
x.tanggal,
x.keterangan,
x.jenis === "masuk" ? "Masuk" : "Keluar",
rupiah(x.jumlah)
];

values.forEach((v,i) => {
const td = document.createElement("td");
td.textContent = v;

if(i === 2){
td.className = x.jenis === "masuk" ? "income" : "expense";
}

tr.appendChild(td);
});

const td = document.createElement("td");
td.className = "actions no-print";

const edit = document.createElement("button");
edit.textContent = "Edit";
edit.className = "edit";
edit.onclick = () => mulaiEdit(x.id);

const hapus = document.createElement("button");
hapus.textContent = "Hapus";
hapus.className = "delete";
hapus.onclick = () => hapusSatu(x.id);

td.appendChild(edit);
td.appendChild(hapus);
tr.appendChild(td);

$("daftarKas").appendChild(tr);
});
}

$("formKas").addEventListener("submit", e => {
e.preventDefault();

const transaksi = {
tanggal: $("tanggal").value,
jenis: $("jenis").value,
keterangan: $("keterangan").value.trim(),
jumlah: Number($("jumlah").value)
};

if(!transaksi.tanggal || !transaksi.keterangan || transaksi.jumlah <= 0){
alert("Mohon isi semua data dengan benar.");
return;
}

if(idEdit !== null){
const index = dataKas.findIndex(x => x.id === idEdit);

if(index !== -1){
dataKas[index] = {
...dataKas[index],
...transaksi
};
}
}else{
dataKas.push({
id: Date.now(),
...transaksi
});
}

simpan();
batalEdit();
tampilkan();
});

function mulaiEdit(id){
const x = dataKas.find(item => item.id === id);
if(!x) return;

idEdit = id;

$("tanggal").value = x.tanggal;
$("jenis").value = x.jenis;
$("keterangan").value = x.keterangan;
$("jumlah").value = x.jumlah;

$("judulForm").textContent = "Edit Transaksi";
$("tombolSimpan").textContent = "Simpan Perubahan";
$("tombolBatal").style.display = "block";

$("formKas").scrollIntoView({behavior:"smooth"});
}

function batalEdit(){
idEdit = null;
$("formKas").reset();

$("judulForm").textContent = "Tambah Transaksi";
$("tombolSimpan").textContent = "Simpan Transaksi";
$("tombolBatal").style.display = "none";

$("tanggal").value = tanggalHariIni();
}

function tanggalHariIni(){
const d = new Date();
const offset = d.getTimezoneOffset();
return new Date(d.getTime() - offset * 60000)
.toISOString().slice(0,10);
}

function hapusSatu(id){
if(!confirm("Hapus transaksi ini?")) return;

dataKas = dataKas.filter(x => x.id !== id);
simpan();

if(idEdit === id) batalEdit();

tampilkan();
}

function hapusSemua(){
if(!confirm("Yakin ingin menghapus seluruh data kas?")) return;

dataKas = [];
simpan();
batalEdit();
tampilkan();
}

function cetakPDF(){
const bulan = $("bulan").value;

if(!bulan){
alert("Pilih bulan terlebih dahulu.");
return;
}

const [tahun, nomorBulan] = bulan.split("-");
const namaBulan = new Date(
Number(tahun), Number(nomorBulan)-1
).toLocaleDateString("id-ID", {
month:"long",
year:"numeric"
});

document.title = "Laporan Kas " + namaBulan;
window.print();
}

function eksporCSV(){
const bulan = $("bulan").value;

const data = dataKas.filter(x => x.tanggal.startsWith(bulan));

if(!data.length){
alert("Belum ada data untuk diekspor.");
return;
}

const rows = [
["Tanggal","Keterangan","Jenis","Jumlah"],
...data.map(x => [
x.tanggal,
x.keterangan,
x.jenis,
x.jumlah
])
];

const csv = rows.map(r =>
r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(",")
).join("\n");

const blob = new Blob(["\uFEFF"+csv], {
type:"text/csv;charset=utf-8;"
});

const url = URL.createObjectURL(blob);
const a = document.createElement("a");

a.href = url;
a.download = "laporan-kas-" + bulan + ".csv";
a.click();

URL.revokeObjectURL(url);
}

$("bulan").value = new Date().toISOString().slice(0,7);
$("tanggal").value = tanggalHariIni();

$("bulan").addEventListener("change", tampilkan);

tampilkan();
</script>
</body>
</html>
